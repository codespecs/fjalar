name: CI

"on":
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

# Cancel in-progress jobs.
# For a pull request, "github.ref" is "refs/pull/NUMBER/merge", which is unique
# per pull request even when the pull request originates from a fork.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  # The container runs as root, but the workspace is owned by the runner's user,
  # so git refuses to operate on it without this setting.  `github.workspace`
  # would not work:  it is the path on the host, not the path in the container.
  GIT_CONFIG_VALUE_0: "*"

jobs:

  # The JDK version doesn't matter, but these Docker images happen to use
  # different underlying OS versions.

  # These jobs run ./test.sh, which builds Fjalar, checks that command-line
  # options are documented, builds the documentation, and runs the Kvasir
  # regression tests.

  ubuntu_26_04:
    runs-on: ubuntu-latest
    container:
      image: mdernst/daikon-ubuntu-jdk11-plus:latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: true
          fetch-depth: 25
          persist-credentials: false
      - name: test.sh
        run: ./test.sh

  rocky_9:
    runs-on: ubuntu-latest
    container:
      image: mdernst/daikon-rockylinux-jdk11-plus:latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: true
          fetch-depth: 25
          persist-credentials: false
      - name: test.sh
        run: ./test.sh

  # These jobs run ./test-kvasir.sh, which runs Daikon's own scripts/test-kvasir.sh
  # against this repository.  That additionally runs the DynComp regression tests.

  kvasir_ubuntu_26_04:
    runs-on: ubuntu-latest
    container:
      image: mdernst/daikon-ubuntu-jdk11-plus:latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: true
          fetch-depth: 25
          persist-credentials: false
      - name: test-kvasir.sh
        run: ./test-kvasir.sh

  kvasir_rocky_9:
    runs-on: ubuntu-latest
    container:
      image: mdernst/daikon-rockylinux-jdk11-plus:latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: true
          fetch-depth: 25
          persist-credentials: false
      - name: test-kvasir.sh
        run: ./test-kvasir.sh
